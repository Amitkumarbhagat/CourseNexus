spring.application.name=backend-springboot

# Database Setup
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/CourseNexus?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Amit}
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false

# JWT Configuration
app.jwtSecret=${JWT_SECRET:mySecretKey1234567890abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ}
app.jwtExpirationMs=${JWT_EXPIRATION:86400000}

# Default Admin Credentials
app.default-admin.username=${ADMIN_USERNAME:admin}
app.default-admin.password=${ADMIN_PASSWORD:admin123}
app.default-admin.email=${ADMIN_EMAIL:admin@gmail.com}

# Cloudinary Setup
cloudinary.url=${CLOUDINARY_URL:YOUR_CLOUDINARY_URL_HERE}

# Razorpay Setup
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TLlt7rOJu3XzOF}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:JZKArcEvL7Ki23sFiMOvEDby}

# Gemini AI Setup
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}

# Redis Setup
spring.data.redis.host=localhost
spring.data.redis.port=6379

# File Upload Size Limits (For Video Uploads)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# MVC & Resources
spring.web.resources.add-mappings=false

# Logging
logging.level.com.coursenexus=${APP_LOG_LEVEL:DEBUG}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:DEBUG}